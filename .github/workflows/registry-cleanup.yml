name: registry-cleanup

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # snok/container-retention-policy needs a PAT (packages:write) to use tag
      # filters; GITHUB_TOKEN can't. Stay inert until the secret is added.
      - id: check
        env:
          TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::GHCR_CLEANUP_TOKEN not set — skipping. Add a PAT with packages:write to enable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: homelab
          image-tags: "!latest" # never touch the moving :latest pointer
          tag-selection: tagged
          cut-off: 1w
          keep-n-most-recent: 15
          dry-run: ${{ inputs.dry-run || 'false' }}
