name: vpn-watchdog

# External reachability check for the WireGuard endpoint. Runs from a GitHub-hosted
# runner (outside the home network entirely) so it can't be fooled by home-network NAT
# hairpinning the way an on-LAN test can. Brings up a real tunnel using a dedicated,
# permanent "gh-watchdog" peer (its client .conf, downloaded from wg-easy, stored
# verbatim as a secret) and checks for an actual handshake — a blind UDP packet send
# can't tell "reachable" from "black-holed" for this protocol, since WireGuard silently
# drops anything that isn't a valid handshake init either way.
#
# On failure the job just exits non-zero; GitHub's own workflow-failure notification
# (email / notification bell) is the alert. See docs/vpn.md "Troubleshooting" for what
# to do when this fires — the RAX10's NAT table has needed a DMZ toggle to recover
# before.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  handshake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - id: check
        env:
          WG_CONF: ${{ secrets.WATCHDOG_WG_CONF }}
        run: |
          if [ -z "$WG_CONF" ]; then
            echo "::warning::WATCHDOG_WG_CONF not set — skipping. See docs/vpn.md for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        name: Install wireguard-tools
        run: sudo apt-get update -qq && sudo apt-get install -y wireguard-tools

      - if: steps.check.outputs.skip != 'true'
        name: Write watchdog peer config
        env:
          WG_CONF: ${{ secrets.WATCHDOG_WG_CONF }}
        run: |
          umask 077
          printf '%s\n' "$WG_CONF" > /tmp/wg0.conf

      - if: steps.check.outputs.skip != 'true'
        name: Bring up tunnel and check for a handshake
        run: |
          sudo wg-quick up /tmp/wg0.conf
          # No PersistentKeepalive on this client (repo default), so WireGuard won't
          # handshake just from the interface coming up — it's lazy and waits for
          # traffic. Ping through the tunnel to trigger the handshake attempt; the
          # ping's own exit code isn't the pass/fail signal (ICMP could be filtered
          # independently of tunnel health) — `wg show` is the actual check.
          ping -c 2 -W 5 1.1.1.1 || true
          if ! sudo wg show wg0 latest-handshakes | awk '{print $2}' | grep -qv '^0$'; then
            echo "::error::No WireGuard handshake — VPN endpoint unreachable from outside the home network"
            exit 1
          fi
          echo "Handshake confirmed — endpoint reachable"

      - if: always() && steps.check.outputs.skip != 'true'
        name: Tear down tunnel
        run: sudo wg-quick down /tmp/wg0.conf || true
