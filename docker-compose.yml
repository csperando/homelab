services:
  homelab:
    build: .
    container_name: homelab
    ports:
      - "5173:5173"
      - "8080:8080"
    volumes:
      - ${WORKSPACE:-./volume}:/root/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stdin_open: true
    tty: true
    restart: unless-stopped
