networks:
  homelab-net:
    name: homelab-net

include:
  - services/postgres/compose.yml

services:
  homelab:
    build: .
    container_name: homelab
    networks: [homelab-net]
    env_file:
      - .env
    ports:
      - "5173:5173"
      - "55123:55123"
    volumes:
      - ${WORKSPACE:-./volume}:/root/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:55123/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stdin_open: true
    tty: true
    restart: unless-stopped
