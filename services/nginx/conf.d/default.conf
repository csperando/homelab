server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Used with a proxy_pass variable below so
    # "homelab" is resolved lazily at request time instead of once at
    # config load — a static proxy_pass target makes nginx fail to
    # start if the homelab container isn't yet attached to the network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # nginx's own liveness check — deliberately does not proxy anywhere,
    # so it stays healthy independent of the homelab container's state.
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Health/dashboard API (catch-all, supports websocket-based HMR)
    location / {
        set $homelab_upstream http://homelab:55123;
        proxy_pass $homelab_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # # API dev server
    # location /api/ {
    #     set $api_upstream http://homelab:3000;
    #     proxy_pass $api_upstream/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # # Frontend dev server
