server {
    listen 80;
    server_name _;

    # nginx's own liveness check — deliberately does not proxy anywhere,
    # so it stays healthy independent of the homelab container's state.
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Health/dashboard API (catch-all, supports websocket-based HMR)
    location / {
        proxy_pass http://homelab:55123/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # # API dev server
    # location /api/ {
    #     proxy_pass http://homelab:3000/;
    #     proxy_set_header Host $host;
