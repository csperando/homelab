services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ../../volume/infra/redis:/data
    networks: [homelab-net]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
