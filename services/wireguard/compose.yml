# WireGuard VPN (wg-easy v14). Server-only: gated behind the `vpn` compose profile
# so `docker compose up` in local dev never starts it. The server activates it with
# COMPOSE_PROFILES=vpn in its .env (see docs/vpn.md).
#
# Unlike the other infra services this one publishes a host port (the WireGuard UDP
# endpoint is the whole point) and needs NET_ADMIN + ip_forward. The web UI stays on
# `expose:` only and is reached through the cloudflared tunnel, never a host port.
#
# Client model: full tunnel (WG_ALLOWED_IPS 0.0.0.0/0, ::/0). The WG_POST_UP rules
# below drop forwarded traffic from wg0 to every RFC1918 range, so a client is a bare
# internet exit with no route to the container network or the home LAN, and cannot
# reach the admin UI over the tunnel.
services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    profiles: ["vpn"]
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${PASSWORD_HASH}
      WG_PORT: ${WG_UDP_PORT:-51820}
      PORT: ${WG_UI_PORT:-51821}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0, ::/0}
      WG_POST_UP: >-
        iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -A INPUT -i wg0 -p tcp --dport ${WG_UI_PORT:-51821} -j DROP;
        iptables -A FORWARD -i wg0 -d 10.0.0.0/8 -j DROP;
        iptables -A FORWARD -i wg0 -d 172.16.0.0/12 -j DROP;
        iptables -A FORWARD -i wg0 -d 192.168.0.0/16 -j DROP;
        iptables -A FORWARD -i wg0 -j ACCEPT;
        iptables -A FORWARD -o wg0 -j ACCEPT;
      WG_POST_DOWN: >-
        iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -D INPUT -i wg0 -p tcp --dport ${WG_UI_PORT:-51821} -j DROP;
        iptables -D FORWARD -i wg0 -d 10.0.0.0/8 -j DROP;
        iptables -D FORWARD -i wg0 -d 172.16.0.0/12 -j DROP;
        iptables -D FORWARD -i wg0 -d 192.168.0.0/16 -j DROP;
        iptables -D FORWARD -i wg0 -j ACCEPT;
        iptables -D FORWARD -o wg0 -j ACCEPT;
    volumes:
      - ../../volume/infra/wireguard:/etc/wireguard
    networks: [homelab-net]
    expose:
      - "${WG_UI_PORT:-51821}"
    ports:
      - "${WG_UDP_PORT:-51820}:51820/udp"
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE   # only if the host kernel has no built-in wireguard module
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
