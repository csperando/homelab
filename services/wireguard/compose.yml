# WireGuard VPN (wg-easy v14). Server-only: gated behind the `vpn` compose profile
# so `docker compose up` in local dev never starts it. The server activates it with
# COMPOSE_PROFILES=vpn in its .env (see docs/vpn.md).
#
# Unlike the other infra services this one publishes a host port (the WireGuard UDP
# endpoint is the whole point) and needs NET_ADMIN + ip_forward. The web UI stays on
# `expose:` only and is reached through the cloudflared tunnel, never a host port.
#
# Client model: full tunnel (WG_ALLOWED_IPS 0.0.0.0/0 — IPv4 only; the container has no
# IPv6 egress, so advertising ::/0 would black-hole clients' v6 traffic). The WG_POST_UP
# rules below drop forwarded traffic from wg0 to every RFC1918 range, so a client is a
# bare internet exit with no route to the container network or the home LAN, and cannot
# reach the admin UI over the tunnel.
#
# WG_LAN_ALLOW_HOST (optional, set in .env — never committed) punches one narrow hole in
# that block: traffic to exactly that IP (e.g. the homelab server itself, to reach the
# dashboard over the tunnel) is accepted before the RFC1918 DROPs are evaluated. Every
# other LAN host stays unreachable. Leave unset to keep the VPN a pure internet-exit
# tunnel with zero LAN access; the default (255.255.255.255) is an inert placeholder that
# nothing ever routes to, so the rule is a no-op when unset.
#
# WG_HOST must be a DNS-only (unproxied) record pointing at the home public IP — the
# WireGuard handshake is UDP and Cloudflare's proxy only carries HTTP(S). It is a
# *separate* record from the proxied admin-UI hostname the cloudflared tunnel owns. The
# wg-ddns companion service keeps that record's A value in sync with the public IP.
services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    profiles: ["vpn"]
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${PASSWORD_HASH}
      WG_PORT: ${WG_UDP_PORT:-51820}
      PORT: ${WG_UI_PORT:-51821}
      WG_DEFAULT_DNS: ${WG_DEFAULT_DNS:-1.1.1.1}
      WG_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0}
      WG_POST_UP: >-
        iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -A INPUT -i wg0 -p tcp --dport ${WG_UI_PORT:-51821} -j DROP;
        iptables -A FORWARD -i wg0 -d ${WG_LAN_ALLOW_HOST:-255.255.255.255} -j ACCEPT;
        iptables -A FORWARD -i wg0 -d 10.0.0.0/8 -j DROP;
        iptables -A FORWARD -i wg0 -d 172.16.0.0/12 -j DROP;
        iptables -A FORWARD -i wg0 -d 192.168.0.0/16 -j DROP;
        iptables -A FORWARD -i wg0 -j ACCEPT;
        iptables -A FORWARD -o wg0 -j ACCEPT;
      WG_POST_DOWN: >-
        iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE;
        iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT;
        iptables -D INPUT -i wg0 -p tcp --dport ${WG_UI_PORT:-51821} -j DROP;
        iptables -D FORWARD -i wg0 -d ${WG_LAN_ALLOW_HOST:-255.255.255.255} -j ACCEPT;
        iptables -D FORWARD -i wg0 -d 10.0.0.0/8 -j DROP;
        iptables -D FORWARD -i wg0 -d 172.16.0.0/12 -j DROP;
        iptables -D FORWARD -i wg0 -d 192.168.0.0/16 -j DROP;
        iptables -D FORWARD -i wg0 -j ACCEPT;
        iptables -D FORWARD -o wg0 -j ACCEPT;
    volumes:
      - ../../volume/infra/wireguard:/etc/wireguard
    networks: [homelab-net]
    expose:
      - "${WG_UI_PORT:-51821}"
    ports:
      - "${WG_UDP_PORT:-51820}:51820/udp"
    cap_add:
      - NET_ADMIN
      # - SYS_MODULE   # only if the host kernel has no built-in wireguard module
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Dynamic DNS for WG_HOST: the WireGuard endpoint record must track the home public
  # IP (which changes) and stay unproxied. Bundled with wireguard rather than split into
  # its own services/<name>/ dir — it exists only to serve this endpoint.
  #
  # The loop is cheap: each tick is one HTTPS GET to an IP-echo service. Cloudflare's API
  # is called only when the detected IP differs from ./volume/infra/wg-ddns/last-ip, or
  # every DDNS_RECONCILE_SECONDS (default 6h) as a drift check — so a tight DDNS_INTERVAL
  # keeps changeover fast without hammering Cloudflare.
  wg-ddns:
    image: alpine:3.21
    profiles: ["vpn"]
    depends_on: [wireguard]
    environment:
      CLOUDFLARE_TOKEN: ${CLOUDFLARE_TOKEN}
      CF_RECORD_NAME: ${WG_HOST}            # single source of truth — always tracks WG_HOST
      CF_ZONE_NAME: ${CF_ZONE_NAME:-}       # optional; script derives it from CF_RECORD_NAME
      DDNS_INTERVAL: ${DDNS_INTERVAL:-60}
      DDNS_RECONCILE_SECONDS: ${DDNS_RECONCILE_SECONDS:-21600}
    volumes:
      - ./cloudflare-ddns.sh:/usr/local/bin/cloudflare-ddns.sh:ro
      - ../../volume/infra/wg-ddns:/state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache bash curl jq >/dev/null
        while true; do
          bash /usr/local/bin/cloudflare-ddns.sh || echo "ddns: check failed"
          sleep "$${DDNS_INTERVAL:-60}"
        done
    networks: [homelab-net]
